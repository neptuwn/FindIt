<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FindIT — Interactive Course Marketplace (Find it. Master it. Teach it.)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
/* ==========================================================================
   FindIT Design System: Light Mode (Current Palette) & Night Mode (VS Code Dark + Bright Amber Yellow)
   ========================================================================== */

:root,
[data-theme="light"] {
  /* Core FindIT Brand Tokens (Light Mode — Preserved from current version) */
  --fi-white: #FFFFFF;
  --fi-indigo: #292866;
  --fi-indigo-rgb: 41, 40, 102;
  --fi-lavender: #C8C2E0;
  --fi-lavender-rgb: 200, 194, 224;
  --fi-mint: #97D0B1;
  --fi-mint-rgb: 151, 208, 177;
  --fi-forest: #406352;
  --fi-forest-rgb: 64, 99, 82;
  --fi-coral: #F05C4F;
  --fi-coral-rgb: 240, 92, 79;
  --fi-coral-dark: #C2392D;

  /* Semantic Surface & Text Tokens */
  --surface-bg: #F6F7FB;
  --card-bg: #FFFFFF;
  --card-elevated: #FFFFFF;
  --sidebar-bg: #292866;
  --sidebar-text: #FFFFFF;
  --sidebar-muted: rgba(255, 255, 255, 0.72);
  --sidebar-active-bg: #C8C2E0;
  --sidebar-active-text: #292866;
  --sidebar-border: rgba(255, 255, 255, 0.14);

  --text-main: #292866;
  --text-secondary: rgba(41, 40, 102, 0.74);
  --text-muted: rgba(41, 40, 102, 0.56);
  --border-color: rgba(41, 40, 102, 0.12);
  --border-strong: rgba(41, 40, 102, 0.24);
  --input-bg: #FFFFFF;

  /* Secondary / Brand Accent Color (Blue/Indigo in Light Mode) */
  --accent-primary: #292866;
  --accent-primary-text: #FFFFFF;
  --accent-secondary: #5465FF;
  --accent-pill-bg: #6C7BFF;
  --accent-pill-text: #FFFFFF;
  --accent-soft: rgba(41, 40, 102, 0.08);
  --accent-soft-text: #292866;
  --accent-highlight: #97D0B1;

  /* Like Button & Status Tokens (Green in Light Mode) */
  --like-color: #16A34A;
  --like-border: #22C55E;
  --like-bg: rgba(34, 197, 94, 0.14);
  --like-glow: 0 0 14px rgba(34, 197, 94, 0.65), 0 0 4px rgba(34, 197, 94, 0.45);
  --like-tooltip-bg: #16A34A;
  --like-tooltip-text: #FFFFFF;
  --like-badge-bg: rgba(34, 197, 94, 0.25);
  --like-badge-text: #4ADE80;

  /* Stepik Activity Graph Colors (Blue glow in Light Mode) */
  --heat-empty: #EAECEF;
  --heat-lvl-1: #BFDBFE;
  --heat-lvl-2: #60A5FA;
  --heat-lvl-3: #2563EB;
  --heat-lvl-4: #1D4ED8;
  --heat-glow-1: 0 0 6px rgba(59, 130, 246, 0.35);
  --heat-glow-2: 0 0 9px rgba(37, 99, 235, 0.55);
  --heat-glow-3: 0 0 12px rgba(29, 78, 216, 0.75);
  --heat-glow-4: 0 0 15px rgba(37, 99, 235, 0.95);

  /* Skeleton Shimmer Colors */
  --skel-base: #E4E6EB;
  --skel-shine: rgba(255, 255, 255, 0.85);

  /* Card Shadows */
  --shadow-card: 0 2px 10px rgba(41, 40, 102, 0.06);
  --shadow-card-hover: 0 14px 32px rgba(41, 40, 102, 0.16), 0 4px 12px rgba(41, 40, 102, 0.08);

  /* Easing Curves (Emil Kowalski principles) */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);

  --font-heading: "Sora", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
}

/* ==========================================================================
   Night Mode: VS Code Dark (#1E1E1E / #252526) + Warm Gold Yellow (#E2B714)
   ========================================================================== */
[data-theme="dark"] {
  --surface-bg: #1E1E1E;
  --card-bg: #252526;
  --card-elevated: #2D2D30;
  --sidebar-bg: #18181A;
  --sidebar-text: #F3F4F6;
  --sidebar-muted: #A1A1AA;
  --sidebar-active-bg: #E2B714;
  --sidebar-active-text: #111111;
  --sidebar-border: rgba(255, 255, 255, 0.09);

  --text-main: #F3F4F6;
  --text-secondary: #D4D4D8;
  --text-muted: #A1A1AA;
  --border-color: rgba(255, 255, 255, 0.10);
  --border-strong: rgba(226, 183, 20, 0.45);
  --input-bg: #1E1E1E;

  /* Secondary / Brand Accent Color -> Warm Muted Yellow (#E2B714) with Black Letters */
  --accent-primary: #E2B714;
  --accent-primary-text: #111111;
  --accent-secondary: #E2B714;
  --accent-pill-bg: #E2B714;
  --accent-pill-text: #111111;
  --accent-soft: #E2B714;
  --accent-soft-text: #111111;
  --accent-highlight: #E2B714;

  /* Like Button & Status Tokens in Night Mode (Matches #E2B714 Yellow with Black Letters) */
  --like-color: #E2B714;
  --like-border: #E2B714;
  --like-bg: rgba(226, 183, 20, 0.20);
  --like-glow: 0 0 14px rgba(226, 183, 20, 0.55), 0 0 4px rgba(226, 183, 20, 0.35);
  --like-tooltip-bg: #E2B714;
  --like-tooltip-text: #111111;
  --like-badge-bg: #E2B714;
  --like-badge-text: #111111;

  /* Stepik Activity Graph Colors (Soft #E2B714 Yellow glow in Night Mode) */
  --heat-empty: #323236;
  --heat-lvl-1: rgba(226, 183, 20, 0.32);
  --heat-lvl-2: rgba(226, 183, 20, 0.55);
  --heat-lvl-3: rgba(226, 183, 20, 0.78);
  --heat-lvl-4: #E2B714;
  --heat-glow-1: 0 0 5px rgba(226, 183, 20, 0.25);
  --heat-glow-2: 0 0 7px rgba(226, 183, 20, 0.40);
  --heat-glow-3: 0 0 10px rgba(226, 183, 20, 0.60);
  --heat-glow-4: 0 0 13px rgba(226, 183, 20, 0.80);

  /* Skeleton Shimmer Colors (Dark Mode) */
  --skel-base: #323236;
  --skel-shine: rgba(226, 183, 20, 0.16);

  /* Card Shadows */
  --shadow-card: 0 4px 14px rgba(0, 0, 0, 0.35);
  --shadow-card-hover: 0 16px 36px rgba(0, 0, 0, 0.60), 0 0 0 1px rgba(226, 183, 20, 0.32);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-body);
  background-color: var(--surface-bg);
  color: var(--text-main);
  line-height: 1.5;
  overflow-x: hidden;
  transition: background-color 0.25s ease, color 0.25s ease;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading);
  color: var(--text-main);
  margin-top: 0;
}

.text-muted {
  color: var(--text-muted) !important;
}

/* ==========================================================================
   Point 13: Top Loading Line (Completes before switching pages)
   ========================================================================== */
.top-loading-bar-wrap {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 3.5px;
  z-index: 9999;
  pointer-events: none;
  background: transparent;
}

.top-loading-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent-secondary), var(--like-border), var(--accent-primary));
  box-shadow: 0 0 12px var(--accent-secondary);
  opacity: 0;
  transition: width 0.28s var(--ease-out), opacity 0.18s ease;
}

/* ==========================================================================
   Point 1: Full-Screen Login / Onboarding Gate (Student vs. Teacher)
   ========================================================================== */
.login-gate-overlay {
  position: fixed;
  inset: 0;
  z-index: 3000;
  background: var(--surface-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
}

.login-gate-overlay.is-hidden {
  display: none !important;
}

.login-card {
  width: 100%;
  max-width: 620px;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 22px;
  box-shadow: var(--shadow-card-hover);
  padding: 28px 32px;
  margin: auto;
}

.role-switch-track {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--surface-bg);
  border: 1px solid var(--border-color);
  border-radius: 14px;
  padding: 4px;
  margin-bottom: 22px;
}

.role-switch-thumb {
  position: absolute;
  top: 4px;
  bottom: 4px;
  left: 4px;
  width: calc(50% - 4px);
  background: var(--accent-primary);
  border-radius: 10px;
  transition: transform 0.3s var(--ease-out);
  z-index: 1;
}

.role-switch-track[data-role="teacher"] .role-switch-thumb {
  transform: translateX(100%);
}

.role-switch-btn {
  position: relative;
  z-index: 2;
  border: 0;
  background: transparent;
  padding: 10px 14px;
  font-weight: 700;
  font-size: 0.88rem;
  color: var(--text-secondary);
  border-radius: 10px;
  cursor: pointer;
  transition: color 0.2s ease;
}

.role-switch-btn.is-active {
  color: var(--accent-primary-text);
}

/* ==========================================================================
   Point 9: Smooth Language Slider with Gliding Cube
   ========================================================================== */
.lang-slider {
  position: relative;
  display: inline-grid;
  grid-template-columns: repeat(3, 1fr);
  background: rgba(255, 255, 255, 0.10);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 10px;
  padding: 3px;
  width: 138px;
  user-select: none;
}

.lang-slider--surface {
  background: var(--surface-bg);
  border-color: var(--border-color);
}

.lang-slider__cube {
  position: absolute;
  top: 3px;
  bottom: 3px;
  left: 3px;
  width: calc((100% - 6px) / 3);
  background: var(--sidebar-active-bg);
  border-radius: 7px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.22);
  transition: transform 0.32s var(--ease-out);
  z-index: 1;
}

.lang-slider[data-lang="uz"] .lang-slider__cube { transform: translateX(0%); }
.lang-slider[data-lang="ru"] .lang-slider__cube { transform: translateX(100%); }
.lang-slider[data-lang="en"] .lang-slider__cube { transform: translateX(200%); }

.lang-slider__btn {
  position: relative;
  z-index: 2;
  border: 0;
  background: transparent;
  padding: 4px 0;
  font-size: 0.72rem;
  font-weight: 800;
  color: var(--sidebar-muted);
  cursor: pointer;
  text-align: center;
  transition: color 0.2s ease;
}

.lang-slider--surface .lang-slider__btn {
  color: var(--text-secondary);
}

.lang-slider__btn.is-active {
  color: var(--sidebar-active-text) !important;
}

/* ==========================================================================
   Layout Shell: Left Sidebar + Folder Explorer Tree + Main Content + Right Panel
   ========================================================================== */
.dashboard-wrapper {
  display: flex;
  min-height: 100vh;
  padding-left: 248px;
}

/* Completely static fixed left sidebar that never scrolls when the page scrolls */
.sidebar {
  width: 248px;
  flex-shrink: 0;
  background: var(--sidebar-bg);
  color: var(--sidebar-text);
  display: flex;
  flex-direction: column;
  padding: 18px 14px;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  height: 100vh;
  overflow-y: auto;
  border-right: 1px solid var(--sidebar-border);
  z-index: 1030;
}

@media (max-width: 991.98px) {
  .dashboard-wrapper {
    padding-left: 0;
  }
  .sidebar {
    transform: translateX(-105%);
    transition: transform 0.28s var(--ease-drawer);
  }
  .sidebar.is-open {
    transform: translateX(0);
  }
}

.sidebar__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding: 0 4px;
}

/* Point 10: Top-left logotype clicks to Main Menu */
.sidebar__brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--sidebar-text);
  font-weight: 800;
  font-size: 1.15rem;
  cursor: pointer;
  transition: transform 0.15s var(--ease-out);
}

.sidebar__brand:hover {
  color: var(--sidebar-text);
  opacity: 0.92;
}

.sidebar__brand:active {
  transform: scale(0.97);
}

.sidebar__logo-circle {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--sidebar-active-bg);
  color: var(--sidebar-active-text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 1rem;
}

.sidebar .nav-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: var(--sidebar-muted);
  padding: 10px 12px;
  border-radius: 11px;
  font-weight: 600;
  font-size: 0.86rem;
  margin-bottom: 4px;
  text-decoration: none;
  transition: background-color 0.18s ease, color 0.18s ease, transform 0.12s ease;
}

.sidebar .nav-link:hover {
  color: var(--sidebar-text);
  background: rgba(255, 255, 255, 0.08);
}

.sidebar .nav-link.active {
  background: var(--sidebar-active-bg);
  color: var(--sidebar-active-text) !important;
  font-weight: 700;
}

.sidebar .nav-link.active span,
.sidebar .nav-link.active svg {
  color: var(--sidebar-active-text) !important;
}

.sidebar .nav-link.active .badge {
  background: rgba(0, 0, 0, 0.18) !important;
  color: var(--sidebar-active-text) !important;
}

.nav-link__inner {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

/* Point 4: Folder-Explorer Sub-themes under Courses */
.folder-tree {
  margin: 2px 0 8px 18px;
  padding-left: 12px;
  border-left: 1.5px dashed rgba(255, 255, 255, 0.25);
  display: none;
  flex-direction: column;
  gap: 3px;
}

.folder-tree.is-expanded {
  display: flex;
}

.folder-tree__item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 0.76rem;
  font-weight: 600;
  color: var(--sidebar-muted);
  text-decoration: none;
  transition: background-color 0.15s ease, color 0.15s ease;
  position: relative;
}

.folder-tree__item::before {
  content: "";
  position: absolute;
  left: -12px;
  top: 50%;
  width: 8px;
  height: 1.5px;
  background: rgba(255, 255, 255, 0.25);
}

.folder-tree__item:hover {
  background: rgba(255, 255, 255, 0.10);
  color: var(--sidebar-text);
}

.folder-tree__item.is-active {
  background: var(--sidebar-active-bg);
  color: var(--sidebar-active-text) !important;
  font-weight: 700;
}

.folder-chevron {
  transition: transform 0.22s var(--ease-out);
}

.folder-chevron.is-rotated {
  transform: rotate(90deg);
}

/* Point 11: Settings in Bottom-Left Corner */
.sidebar__footer {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--sidebar-border);
}

/* ==========================================================================
   Point 15: Stepik-Style Course Boxes (Image 3) + Green Glowing Like Button
   ========================================================================== */
.stepik-course-card {
  position: relative;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  padding: 20px 22px;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: var(--shadow-card);
  transition: box-shadow 0.26s var(--ease-out), transform 0.26s var(--ease-out), border-color 0.26s ease;
}

.stepik-course-card:hover {
  box-shadow: var(--shadow-card-hover);
  transform: translateY(-3px);
  border-color: var(--border-strong);
}

.stepik-course-card.is-best-deal {
  border: 2px solid var(--accent-secondary);
}

.best-deal-ribbon {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--accent-pill-bg);
  color: var(--accent-pill-text);
  font-size: 0.68rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 4px 10px;
  border-radius: 999px;
  margin-bottom: 10px;
  width: fit-content;
}

.stepik-card__top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 14px;
}

.stepik-card__info {
  flex: 1;
  min-width: 0;
}

.stepik-card__title {
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.32;
  margin-bottom: 6px;
}

.stepik-card__title a {
  color: var(--text-main);
  text-decoration: none;
}

.stepik-card__title a:hover {
  color: var(--accent-secondary);
}

.stepik-card__author {
  font-size: 0.83rem;
  color: var(--text-secondary);
  margin-bottom: 4px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.stepik-card__honors {
  font-size: 0.72rem;
  color: var(--text-muted);
  margin-bottom: 10px;
}

/* Point 3 Clarification: Directly under the teacher name, show past student results + counts & hours */
.stepik-card__meta-stats {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-top: 6px;
}

.stepik-card__meta-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.stepik-card__student-result {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--accent-soft-text);
  background: var(--accent-soft);
  padding: 4px 10px;
  border-radius: 7px;
  margin-top: 6px;
}

.stepik-card__thumb-wrap {
  position: relative;
  width: 84px;
  height: 84px;
  flex-shrink: 0;
  border-radius: 16px;
  background: var(--surface-bg);
  border: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
}

/* Point 15: Like button on top-right corner, glows green on hover and shows "I like it" tooltip */
.stepik-like-btn {
  position: absolute;
  top: -10px;
  right: -10px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.10);
  transition: all 0.2s var(--ease-out);
  z-index: 4;
}

.stepik-like-btn:hover {
  color: var(--like-color);
  border-color: var(--like-border);
  background: var(--like-bg);
  box-shadow: var(--like-glow);
  transform: scale(1.08);
}

.stepik-like-btn.is-liked {
  color: var(--like-color);
  border-color: var(--like-border);
  background: var(--like-bg);
}

.stepik-like-btn__tooltip {
  position: absolute;
  bottom: calc(100% + 7px);
  right: 50%;
  transform: translateX(50%) translateY(4px);
  background: var(--like-tooltip-bg);
  color: var(--like-tooltip-text);
  font-size: 0.68rem;
  font-weight: 800;
  white-space: nowrap;
  padding: 3px 9px;
  border-radius: 6px;
  pointer-events: none;
  opacity: 0;
  box-shadow: var(--like-glow);
  transition: opacity 0.18s var(--ease-out), transform 0.18s var(--ease-out);
}

.stepik-like-btn:hover .stepik-like-btn__tooltip {
  opacity: 1;
  transform: translateX(50%) translateY(0);
}

.stepik-card__bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-top: 12px;
  margin-top: 8px;
  border-top: 1px solid var(--border-color);
}

.stepik-card__price-wrap {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.stepik-card__price {
  font-size: 1.08rem;
  font-weight: 800;
  color: var(--accent-secondary);
}

.stepik-card__stars {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: 0.82rem;
  color: #F59E0B;
  font-weight: 700;
}

.stepik-card__module-pill {
  background: var(--accent-pill-bg);
  color: var(--accent-pill-text);
  font-size: 0.72rem;
  font-weight: 700;
  padding: 4px 11px;
  border-radius: 8px;
  text-decoration: none;
  white-space: nowrap;
}

/* ==========================================================================
   Point 14: Stepik Skeleton Card Template with Glancing Shimmer Effect (Image 2)
   ========================================================================== */
.stepik-skeleton-card {
  position: relative;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  padding: 22px;
  height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  box-shadow: var(--shadow-card);
}

/* Diagonal Glancing Shimmer Sweep */
.stepik-skeleton-card::after {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 90%;
  height: 100%;
  background: linear-gradient(
    105deg,
    transparent 20%,

/* ==========================================================================
   FindIT Fee & Value Score Calculation Engine
   ========================================================================== */
(function (global) {
  "use strict";

  var FindIt = (global.FindIt = global.FindIt || {});

  var EXAMPLE_FEE_TIERS_CONFIG = {
    tiers: [
      { minSubscribers: 0, ratePercent: 5, label: "Base Tier (0–99)" },
      { minSubscribers: 100, ratePercent: 4, label: "Growth Tier (100–499)" },
      { minSubscribers: 500, ratePercent: 3, label: "Scale Tier (500–999)" },
      { minSubscribers: 1000, ratePercent: 2, label: "Partner Tier (1000+)" }
    ]
  };

  function getTierForSubscribers(subscriberCount) {
    var count = Math.max(0, Math.floor(Number(subscriberCount) || 0));
    var tiers = EXAMPLE_FEE_TIERS_CONFIG.tiers;
    var matched = tiers[0];
    for (var i = 0; i < tiers.length; i++) {
      if (count >= tiers[i].minSubscribers) matched = tiers[i];
    }
    return matched;
  }

  function calculateCourseEconomics(priceUzs, subscriberCount) {
    var price = Math.max(0, Math.round(Number(priceUzs) || 0));
    var subs = Math.max(0, Math.floor(Number(subscriberCount) || 0));
    var tier = getTierForSubscribers(subs);
    var rateDecimal = tier.ratePercent / 100;
    var feePerSubscriber = Math.round(price * rateDecimal);
    var netPerSubscriber = Math.max(0, price - feePerSubscriber);
    var grossRevenue = price * subs;
    var findItFeeTotal = feePerSubscriber * subs;
    var netEarnings = grossRevenue - findItFeeTotal;
    return {
      priceUzs: price,
      subscriberCount: subs,
      ratePercent: tier.ratePercent,
      tierLabel: tier.label,
      feePerSubscriber: feePerSubscriber,
      netPerSubscriber: netPerSubscriber,
      grossRevenue: grossRevenue,
      findItFeeTotal: findItFeeTotal,
      netEarnings: netEarnings
    };
  }

  function calculateStudioSummary(courses) {
    var list = Array.isArray(courses) ? courses : [];
    var totalSubscribers = 0;
    var totalGross = 0;
    var totalFee = 0;
    var totalNet = 0;
    var breakdown = [];

    for (var i = 0; i < list.length; i++) {
      var c = list[i] || {};
      var econ = calculateCourseEconomics(c.price || 0, c.subscribers || 0);
      totalSubscribers += econ.subscriberCount;
      totalGross += econ.grossRevenue;
      totalFee += econ.findItFeeTotal;
      totalNet += econ.netEarnings;
      breakdown.push({
        courseId: c.id,
        title: c.title,
        economics: econ
      });
    }

    var effectiveRatePercent = totalGross > 0
      ? Math.round((totalFee / totalGross) * 1000) / 10
      : 5.0;

    return {
      totalSubscribers: totalSubscribers,
      totalGross: totalGross,
      totalFee: totalFee,
      totalNet: totalNet,
      effectiveRatePercent: effectiveRatePercent,
      breakdown: breakdown
    };
  }

  /**
   * Point 7 & User Clarification #5:
   * Combined Value Score balancing rating, review count, and price:
   * Higher rating + higher verified review volume + more affordable price = higher score.
   * Formula: ((rating ^ 2) * Math.log10(reviewCount + 10)) / (price / 100000)
   */
  function calculateValueScore(course) {
    if (!course) return 0;
    var rating = Number(course.rating) || 4.5;
    var reviews = Math.max(1, Number(course.reviewCount) || 1);
    var priceIn100k = Math.max(1, (Number(course.price) || 350000) / 100000);
    var raw = (Math.pow(rating, 2) * Math.log10(reviews + 10)) / priceIn100k;
    return Math.round(raw * 100) / 100;
  }

  FindIt.fees = {
    calculateCourseEconomics: calculateCourseEconomics,
    calculateStudioSummary: calculateStudioSummary,
    calculateValueScore: calculateValueScore
  };
})(window);

  /**
   * Point 5 & Image 1 & Clarification #4:
   * Stepik 52-Week Activity Heatmap
   * - Glowing Blue in Light Mode, Glowing Bright Amber Yellow in Night Mode
   * - Brightness level (1..4) depends on hours spent on the app that day
   * - Red square outline on Today's cell (index 363)
   */
  function getHeatLevelForHours(hours) {
    var h = Number(hours) || 0;
    if (h <= 0) return 0;
    if (h <= 1.0) return 1;
    if (h <= 2.2) return 2;
    if (h <= 3.5) return 3;
    return 4;
  }

  function renderStepikYearlyHeatmap() {
    var user = FindIt.store.getUser();
    var esc = FindIt.store.escapeHtml;
    var t = FindIt.i18n.t;
    var rawArr = (user && Array.isArray(user.yearlyActivityHours) && user.yearlyActivityHours.length >= 364)
      ? user.yearlyActivityHours
      : FindIt.seed.DEFAULT_USER.yearlyActivityHours;

    /* Ensure 546 days (78 weeks x 7 days) for the extended 18-month activity calendar */
    var hoursArr = rawArr.slice();
    while (hoursArr.length < 546) {
      hoursArr.unshift((hoursArr.length % 11 === 0) ? 2.0 : 0);
    }
    if (hoursArr.length > 546) {
      hoursArr = hoursArr.slice(hoursArr.length - 546);
    }

    var totalDays = 546;
    var cellsHtml = "";
    var activeDays = 0;
    var totalHours = 0;
    var currentStreak = 0;
    var longestStreak = 0;
    var tempStreak = 0;

    for (var i = 0; i < totalDays; i++) {
      var hrs = Number(hoursArr[i]) || 0;
      if (hrs > 0) {
        activeDays++;
        totalHours += hrs;
        tempStreak++;
        if (tempStreak > longestStreak) longestStreak = tempStreak;
      } else {
        tempStreak = 0;
      }
      var lvl = getHeatLevelForHours(hrs);
      var isToday = i === totalDays - 1;
      cellsHtml +=
        '<div class="stepik-heat-cell ' + (isToday ? "is-today" : "") + '" ' +
        'data-level="' + lvl + '" data-day-index="' + i + '" data-hours="' + hrs + '" ' +
        'title="' + (isToday ? "Bugun (Today): " : "Kun #" + (i + 1) + ": ") + hrs + ' soat faollik"></div>';
    }

    for (var s = totalDays - 1; s >= 0; s--) {
      if ((Number(hoursArr[s]) || 0) > 0) currentStreak++;
      else break;
    }

    var months18 = [
      "июнь '25", "июль", "авг.", "сент.", "окт.", "нояб.", "дек.",
      "янв. '26", "февр.", "март", "апр.", "май", "июнь", "июль", "авг.", "сент.", "окт.", "нояб."
    ];
    var monthsHtml = months18.map(function (m) {
      return '<span>' + m + '</span>';
    }).join("");

    var weekdays = ["Dush", "Sesh", "Chor", "Pay", "Jum", "Shan", "Yak"];
    var weekdaysHtml = weekdays.map(function (w) {
      return '<span>' + w + '</span>';
    }).join("");

    /* 12-Month Monthly Breakdown Strip below the extended grid */
    var recent12Names = ["Dek", "Yan", "Fev", "Mar", "Apr", "May", "Iyun", "Iyul", "Avg", "Sen", "Okt", "Noy"];
    var monthlyCardsHtml = recent12Names.map(function (mName, mIdx) {
      var startIdx = 546 - 364 + mIdx * 30;
      var mHours = 0;
      var mActive = 0;
      for (var d = startIdx; d < Math.min(546, startIdx + 30); d++) {
        var hVal = Number(hoursArr[d]) || 0;
        if (hVal > 0) {
          mHours += hVal;
          mActive++;
        }
      }
      var barPct = Math.min(100, Math.round((mHours / 36) * 100));
      return (
        '<div class="col-6 col-sm-4 col-md-2 col-xl-1">' +
          '<div class="p-2 rounded-3 text-center h-100" style="background:var(--surface-bg); border:1px solid var(--border-color);">' +
            '<div class="fw-bold small">' + mName + '</div>' +
            '<div class="small fw-semibold" style="color:var(--accent-secondary); font-size:0.74rem;">' + Math.round(mHours * 10) / 10 + 's</div>' +
            '<div class="progress my-1" style="height:4px; background:var(--border-color);">' +
              '<div class="progress-bar" style="width:' + barPct + '%; background:var(--accent-secondary);"></div>' +
            '</div>' +
            '<div class="text-muted" style="font-size:0.65rem;">' + mActive + ' kun</div>' +
          '</div>' +
        '</div>'
      );
    }).join("");

    var todayHours = Number(hoursArr[totalDays - 1]) || 0;

    return (
      '<div class="stepik-activity-box mb-4" data-testid="extended-activity-calendar">' +
        '<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">' +
          '<div>' +
            '<div class="d-flex align-items-center gap-2 mb-1">' +
              '<h3 class="h5 fw-bold mb-0">' + esc(t("profile.year_activity")) + '</h3>' +
              '<span class="badge rounded-pill" style="background:var(--accent-pill-bg); color:var(--accent-pill-text); font-size:0.72rem;">Kengaytirilgan · 78 hafta (546 kun)</span>' +
            '</div>' +
            '<div class="small text-muted">' +
              'Faol kunlar: <strong>' + activeDays + ' kun</strong> · ' +
              'Jami o’quv soati: <strong>' + Math.round(totalHours * 10) / 10 + ' soat</strong> · ' +
              'Joriy streak: <strong>🔥 ' + currentStreak + ' kun</strong> · ' +
              'Rekord streak: <strong>🏆 ' + longestStreak + ' kun</strong>' +
            '</div>' +
          '</div>' +
          '<div class="d-flex align-items-center flex-wrap gap-2">' +
            '<span class="small fw-semibold text-muted">' + esc(t("profile.log_hours")) + '</span>' +
            [0, 1, 2, 3, 5].map(function (h) {
              var activeBtn = Math.round(todayHours) === h;
              return (
                '<button type="button" class="btn btn-sm ' + (activeBtn ? "btn-primary" : "btn-outline-primary") + ' rounded-pill px-2 py-1 js-log-today-hours" data-hours="' + h + '" style="font-size:0.72rem;">' +
                  (h === 0 ? "0s" : h + " soat") +
                '</button>'
              );
            }).join("") +
          '</div>' +
        '</div>' +

        '<div class="stepik-heatmap-scroll">' +
          '<div class="stepik-heatmap-layout">' +
            '<div class="stepik-weekdays-col">' + weekdaysHtml + '</div>' +
            '<div class="stepik-heatmap-grid" id="stepik-yearly-grid" style="--heatmap-weeks: 78;">' +
              cellsHtml +
            '</div>' +
          '</div>' +
          '<div class="stepik-months-row" style="--heatmap-months: 18;">' +
            monthsHtml +
          '</div>' +
        '</div>' +

        /* Monthly Activity Breakdown Strip inside the extended calendar */
        '<div class="mt-3 pt-3 border-top">' +
          '<div class="d-flex justify-content-between align-items-center mb-2">' +
            '<span class="small fw-bold">Oylar kesimida o’quv soatlari va faollik dinamikasi (12 oylik tahlil)</span>' +
            '<span class="small text-muted">Katakchani bosib soatni o’zgartirishingiz mumkin</span>' +
          '</div>' +
          '<div class="row g-2">' +
            monthlyCardsHtml +
          '</div>' +
        '</div>' +

        '<div class="d-flex flex-wrap justify-content-between align-items-center mt-3 pt-2 border-top small text-muted">' +
          '<div class="d-flex align-items-center gap-2">' +
            '<span>Kamroq (0s)</span>' +
            '<span class="stepik-heat-cell" data-level="0" style="display:inline-block; width:13px; height:13px;"></span>' +
            '<span class="stepik-heat-cell" data-level="1" style="display:inline-block; width:13px; height:13px;"></span>' +
            '<span class="stepik-heat-cell" data-level="2" style="display:inline-block; width:13px; height:13px;"></span>' +
            '<span class="stepik-heat-cell" data-level="3" style="display:inline-block; width:13px; height:13px;"></span>' +
            '<span class="stepik-heat-cell" data-level="4" style="display:inline-block; width:13px; height:13px;"></span>' +
            '<span>Ko’proq (4+ soat)</span>' +
          '</div>' +
          '<div>' + esc(t("profile.next_day_utc")) + '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function updateSidebarFolderAndCounts() {
    var esc = FindIt.store.escapeHtml;
    var user = FindIt.store.getUser();
    var enrollments = FindIt.store.getEnrollments();
    var likedIds = FindIt.store.getLikedIds();

    var folderEl = document.getElementById("sidebar-courses-folder");
    var countEl = document.getElementById("applied-courses-count");
    var likedCountEl = document.getElementById("liked-courses-count");
    var studioItem = document.getElementById("sidebar-studio-item");

    if (countEl) countEl.textContent = String(enrollments.length);
    if (likedCountEl) likedCountEl.textContent = String(likedIds.length);

    /* Point 3: Studio is shown ONLY if they applied/logged in as a Teacher */
    if (studioItem) {
      if (user && user.role === "teacher") {
        studioItem.classList.remove("d-none");
      } else {
        studioItem.classList.add("d-none");
      }
    }

    if (!folderEl) return;
    if (!enrollments.length) {
      folderEl.innerHTML =
        '<div class="small px-2 py-1" style="color:var(--sidebar-muted); font-size:0.72rem;">Hozircha yozilgan kurs yo\'q</div>';
      return;
    }

    var currentHash = (FindIt.router && FindIt.router.getActiveHash ? FindIt.router.getActiveHash() : (global.location.hash || "#/"));
    folderEl.innerHTML = enrollments.map(function (enr) {
      var c = FindIt.store.getCourseBySlugOrId(enr.courseId);
      if (!c) return "";
      var shortName = c.title.length > 25 ? c.title.slice(0, 23) + "…" : c.title;
      var targetHash = "#/courses/" + c.slug;
      var isActive = currentHash === targetHash;
      return (
        '<a href="' + esc(targetHash) + '" class="folder-tree__item ' + (isActive ? "is-active" : "") + '" title="' + esc(c.title) + '">' +
          '<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" style="flex-shrink:0;">' +

          '</svg>' +
          '<span class="text-truncate">' + esc(shortName) + '</span>' +
        '</a>'
      );
    }).join("");

      if (f.category && f.category !== "all" && c.category !== f.category) {

      if (f.maxPrice && Number(c.price) > Number(f.maxPrice)) {

        ].join(" ").toLowerCase();

    });

    filtered.sort(function (a, b) {

      if (logoLink) {
        e.preventDefault();
        navigateTo("#/", false);
        return;
      }

      /* Any internal hash route link a[href^="#/"] */
      var routeLink = e.target.closest('a[href^="#/"]');
      if (routeLink) {
        e.preventDefault();
        var href = routeLink.getAttribute("href") || "#/";
        /* Point 4: If clicking Courses while already on #/courses, toggle folder tree */
        if (routeLink.id === "nav-courses-toggle" && getActiveHash().indexOf("#/courses") === 0) {
          var treeEl = document.getElementById("sidebar-courses-folder");
          var chevEl = document.getElementById("courses-folder-chevron");
          if (treeEl) treeEl.classList.toggle("is-expanded");
          if (chevEl) chevEl.classList.toggle("is-rotated");
          return;
        }
        navigateTo(href, false);
        return;
      }

      /* Point 4: Courses sidebar item toggles folder tree AND navigates to #/courses */
      var coursesToggle = e.target.closest("#nav-courses-toggle");
      if (coursesToggle) {
        var tree = document.getElementById("sidebar-courses-folder");
        var chev = document.getElementById("courses-folder-chevron");
        if (tree && global.location.hash.indexOf("#/courses") === 0) {
          e.preventDefault();
          tree.classList.toggle("is-expanded");
          if (chev) chev.classList.toggle("is-rotated");
          return;
        }
      }

      /* Point 9: Smooth Language Slider button */
      var langBtn = e.target.closest(".js-lang-btn");
      if (langBtn) {
        var code = langBtn.getAttribute("data-lang");
        FindIt.i18n.setLang(code);
        syncAllI18nStrings();
        renderRouteWithTransition(true);
        return;
      }

      /* Point 15: Like button on top-right corner of course card */
      var likeBtn = e.target.closest(".js-like-course-btn");
      if (likeBtn) {
        e.preventDefault();
        e.stopPropagation();
        var cId = likeBtn.getAttribute("data-course-id");
        var res = FindIt.store.toggleLikeCourse(cId);
        FindIt.ui.updateSidebarFolderAndCounts();
        renderRouteWithTransition(true);
        FindIt.ui.showToast(res.liked ? "💚 Kurs 'Liked courses' ro’yxatiga qo'shildi!" : "Kurs yoqtirilganlardan olib tashlandi");
        return;
      }

      /* Category filter chip */
      var catChip = e.target.closest(".js-cat-chip");
      if (catChip) {
        FindIt.store.saveFilters({ category: catChip.getAttribute("data-category") });
        renderRouteWithTransition(false);
        return;
      }

      /* Clear search input */
      if (e.target.closest("#clear-search-btn")) {
        FindIt.store.saveFilters({ query: "" });
        renderRouteWithTransition(true);
        return;
      }

      /* Open Checkout / Apply Drawer */
      var applyBtn = e.target.closest(".js-open-checkout");
      if (applyBtn) {
        FindIt.ui.openCheckoutDrawer(applyBtn.getAttribute("data-course-id"));
        return;
      }

      /* Close Offcanvas Drawer */
      if (e.target.closest(".js-close-offcanvas") || e.target.closest("#offcanvas-backdrop")) {
        FindIt.ui.closeAllDrawers();
        return;
      }

      /* Toggle lesson completion inside Courses folder explorer */
      var lessonBtn = e.target.closest(".js-toggle-lesson");
      if (lessonBtn) {
        var courseId = lessonBtn.getAttribute("data-course-id");
        var lessonId = lessonBtn.getAttribute("data-lesson-id");
        var prog = FindIt.store.toggleLessonComplete(courseId, lessonId);
        /* Also bump today's activity hours when completing a lesson */
        var usr = FindIt.store.getUser();
        var curToday = (usr.yearlyActivityHours && usr.yearlyActivityHours[363]) || 0;
        FindIt.store.logTodayActivityHours(Math.min(6, curToday + 1));
        FindIt.ui.updateSidebarFolderAndCounts();
        renderRouteWithTransition(true);
        FindIt.ui.showToast("Dars holati yangilandi (" + prog.percent + "%)!");
        return;
      }

      /* Unenroll from course in Courses folder explorer */
      var unenrollBtn = e.target.closest(".js-unenroll-course");
      if (unenrollBtn) {
        var uCourseId = unenrollBtn.getAttribute("data-course-id");
        FindIt.store.removeEnrollment(uCourseId);
        FindIt.ui.updateSidebarFolderAndCounts();
        renderRouteWithTransition(true);
        FindIt.ui.showToast("Kurs papkadan o'chirildi");
        return;
      }

      /* Log today's study hours on Stepik Activity Graph */
      var logHoursBtn = e.target.closest(".js-log-today-hours");
      if (logHoursBtn) {
        var h = Number(logHoursBtn.getAttribute("data-hours")) || 0;
        FindIt.store.logTodayActivityHours(h);
        renderRouteWithTransition(true);
        FindIt.ui.showToast("Bugungi faollik: " + h + " soat belgilandi!");
        return;
      }

      /* Click individual cell in Stepik Activity Graph to cycle its hours (0 -> 1 -> 2.5 -> 4) */
      var heatCell = e.target.closest(".stepik-heat-cell[data-day-index], .mini-heat-cell[data-day-index]");
      if (heatCell) {
        var idx = Number(heatCell.getAttribute("data-day-index"));
        var userObj = FindIt.store.getUser();
        var arr = userObj.yearlyActivityHours.slice();
        var cur = Number(arr[idx]) || 0;
        var nextHrs = cur === 0 ? 1.0 : (cur <= 1.0 ? 2.0 : (cur <= 2.2 ? 3.2 : (cur <= 3.5 ? 4.5 : 0)));
        arr[idx] = nextHrs;
        FindIt.store.updateUser({ yearlyActivityHours: arr });
        renderRouteWithTransition(true);
        return;
      }

      /* Settings: Theme Switch (Light vs Night Mode) */
      var themeBtn = e.target.closest(".js-theme-switch");
      if (themeBtn) {
        var nextTheme = themeBtn.getAttribute("data-theme");
        applyTheme(nextTheme);
        renderRouteWithTransition(true);
        FindIt.ui.showToast(nextTheme === "dark" ? "🌙 Night Mode (Code Dark + Amber Yellow) yoqildi" : "☀️ Light Mode yoqildi");
        return;
      }

      /* Settings: Quick Role Switch (Student vs Teacher) */
      var quickRoleBtn = e.target.closest(".js-quick-role-switch");
      if (quickRoleBtn) {
        var newRole = quickRoleBtn.getAttribute("data-role");
        var u = FindIt.store.updateUser({ role: newRole });
        if (newRole === "teacher") {
          FindIt.store.registerOrUpdateTeacherCourse(u);
        }
        FindIt.ui.updateSidebarFolderAndCounts();
        renderRouteWithTransition(true);
        FindIt.ui.showToast("Rol o’zgartirildi: " + (newRole === "teacher" ? "Teacher (Studio ochildi)" : "Student"));
        return;
      }

      /* Mobile Sidebar Toggle */
      if (e.target.closest("#mobile-menu-toggle")) {
        document.getElementById("app-sidebar").classList.add("is-open");
        document.getElementById("sidebar-backdrop").classList.add("is-open");
        return;
      }
      if (e.target.closest("#sidebar-close-btn") || e.target.closest("#sidebar-backdrop")) {
        document.getElementById("app-sidebar").classList.remove("is-open");
        document.getElementById("sidebar-backdrop").classList.remove("is-open");
        return;
      }
    });

    /* Live Search Input & Filter Select Changes */
    document.addEventListener("input", function (e) {
      if (e.target && e.target.id === "main-search-input") {
        var val = e.target.value;
        FindIt.store.saveFilters({ query: val });
        renderRouteWithTransition(true);
        var inputAfter = document.getElementById("main-search-input");
        if (inputAfter) {
          inputAfter.focus();
          try { inputAfter.setSelectionRange(val.length, val.length); } catch (err) {}
        }
      }
    });

    document.addEventListener("change", function (e) {
      var t = e.target;
      if (!t) return;
      if (t.id === "filter-max-price") {
        FindIt.store.saveFilters({ maxPrice: Number(t.value) || 600000 });
        renderRouteWithTransition(false);
        return;
      }
      if (t.id === "filter-min-rating") {
        FindIt.store.saveFilters({ minRating: Number(t.value) || 0 });
        renderRouteWithTransition(false);
        return;
      }
      if (t.classList.contains("js-setting-toggle")) {
        var key = t.getAttribute("data-setting");
        var u = FindIt.store.getUser();
        var notif = Object.assign({}, u.notifications || {});
        notif[key] = t.checked;
        FindIt.store.updateUser({ notifications: notif });
        FindIt.ui.showToast("Bildirishnoma sozlamasi saqlandi");
        return;
      }
      if (t.classList.contains("js-video-autoplay")) {
        var u2 = FindIt.store.getUser();
        var vd = Object.assign({}, u2.videoDefaults || {}, { autoplayPreview: t.checked });
        FindIt.store.updateUser({ videoDefaults: vd });
        FindIt.ui.showToast("Video auto-play sozlamasi saqlandi");
        return;
      }
      if (t.id === "vid-quality") {
        var u3 = FindIt.store.getUser();
        var vd2 = Object.assign({}, u3.videoDefaults || {}, { defaultQuality: t.value });
        FindIt.store.updateUser({ videoDefaults: vd2 });
        FindIt.ui.showToast("Standart video sifati: " + t.value);
      }
    });

    /* Form Submissions */
    document.addEventListener("submit", function (e) {
      var form = e.target;
      if (!form) return;

      /* Point 1 & 2: Login Gate Submit -> Disappears and sends user to Main Menu */
      if (form.id === "login-gate-form") {
        e.preventDefault();
        var fd = new FormData(form);
        var role = fd.get("role") || "student";
        var updatedUser = FindIt.store.updateUser({
          hasCompletedLogin: true,
          role: role,
          email: String(fd.get("email") || "").trim(),
          name: String(fd.get("username") || "").trim(),
          handle: String(fd.get("username") || "user").trim().toLowerCase().replace(/[^a-z0-9]+/g, "-"),
          major: String(fd.get("major") || "Computer Science").trim(),
          subjectCert: String(fd.get("subjectCert") || "IELTS Academic 8.0+").trim(),
          honors: String(fd.get("honors") || "Verified Teacher").trim(),
          pastStudentsResult: String(fd.get("pastStudentsResult") || "94% scored A+ in 2026").trim(),
          paymentCard: String(fd.get("paymentCard") || "8600 •••• •••• 7814").trim(),
          coursePrice: Number(fd.get("coursePrice")) || 420000
        });

        if (role === "teacher") {
          FindIt.store.registerOrUpdateTeacherCourse(updatedUser);
        }

        var gate = document.getElementById("login-gate-overlay");
        if (gate) gate.classList.add("is-hidden");

        FindIt.ui.updateSidebarFolderAndCounts();
        navigateTo("#/", false);
        FindIt.ui.showToast("Xush kelibsiz, " + updatedUser.name + "!");
        return;
      }

      /* Checkout / Apply Form Submit -> Adds course to Folder-Explorer Sub-themes */
      if (form.id === "checkout-demo-form") {
        e.preventDefault();
        var courseId = form.getAttribute("data-course-id");
        var adapterInput = form.querySelector("input[name='paymentAdapter']:checked");
        var adapter = adapterInput ? adapterInput.value : "Payme";
        FindIt.store.applyForCourse(courseId, adapter);
        FindIt.ui.closeAllDrawers();
        FindIt.ui.updateSidebarFolderAndCounts();
        var cObj = FindIt.store.getCourseBySlugOrId(courseId);
        FindIt.ui.showToast("Kursga muvaffaqiyatli yozildingiz! 'Courses' papkasiga qo'shildi.");
        if (cObj) {
          navigateTo("#/courses/" + cObj.slug, false);
        } else {
          renderRouteWithTransition(true);
        }
        return;
      }

      /* Studio Review Reply Form */
      if (form.classList.contains("js-studio-reply-form")) {
        e.preventDefault();
        var rId = form.getAttribute("data-review-id");
        var inp = form.querySelector("input");
        if (inp && inp.value.trim()) {
          FindIt.store.replyToReview(rId, inp.value.trim());
          renderRouteWithTransition(true);
          FindIt.ui.showToast("Javobingiz saqlandi!");
        }
      }
    });
  }

  function init() {
    FindIt.store.initSeed();
    var user = FindIt.store.getUser();
    applyTheme(user.theme || "light");
    FindIt.i18n.setLang(FindIt.i18n.getLang());
    syncAllI18nStrings();
    setLoginGateRole(user.role || "student");

    var gate = document.getElementById("login-gate-overlay");
    if (gate) {
      if (user.hasCompletedLogin) {
        gate.classList.add("is-hidden");
      } else {
        gate.classList.remove("is-hidden");
      }
    }

    bindEvents();
    renderRouteWithTransition(true);
  }

  FindIt.router = {
    getActiveHash: getActiveHash,
    navigateTo: navigateTo,
    renderRouteWithTransition: renderRouteWithTransition
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})(window);
</script>
</body>
</html>
